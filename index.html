<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sai | Store Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .chat-container {
            width: 400px;
            max-width: 95%;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .chat-header {
            background: #222;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-messages {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
        }

        .user-message {
            background: #e5e5e5;
            margin-left: auto;
        }

        .ai-message {
            background: #222;
            color: white;
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .chat-input button {
            padding: 15px 20px;
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #444;
        }
        .product-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .product-content {
            padding: 16px;
        }

        .product-content h3 {
            margin: 0 0 10px;
            font-size: 17px;
            color: #222;
        }

        .product-description {
            margin: 0 0 14px;
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
        }

        .product-stock {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .in-stock {
            color: #16833b;
        }

        .out-of-stock {
            color: #c62828;
        }

        .product-button {
            display: block;
            text-align: center;
            background: #222;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .product-button:hover {
            background: #444;
        }

        .sale-price {
            color: #b42318;
            font-weight: 700;
        }

        .regular-price {
            color: #777;
            margin-left: 6px;
            font-size: 0.9em;
        }

        .sale-badge {
            color: #b42318;
            margin-left: 6px;
            font-size: 0.8em;
            font-weight: 700;
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            background: #f3f0eb;
        }

        .chat-container {
            width: min(100%, 460px);
            height: min(780px, calc(100dvh - 32px));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border: 1px solid #e6e0d7;
        }

        .chat-header {
            background: #252522;
            padding: 20px;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            height: auto;
            background: #fcfbf9;
            scroll-behavior: smooth;
        }

        .chat-input {
            flex-shrink: 0;
            background: #fff;
        }

        .chat-input input {
            min-width: 0;
        }

        .chat-input button {
            background: #8a642f;
            font-weight: 600;
        }

        .chat-input button:hover {
            background: #704e23;
        }

        @media (max-width: 520px) {
            body {
                padding: 0;
            }

            .chat-container {
                width: 100%;
                height: 100dvh;
                max-width: none;
                border: 0;
                border-radius: 0;
            }
        }
        #leadCapturePrompt {
    box-sizing: border-box;
    flex: 0 0 auto;
    width: calc(100% - 30px);
    max-width: none;
    margin: 0 15px 12px;
}

#leadCaptureForm label {
    display: block;
    margin: 10px 0;
}

#leadCaptureForm input:not([type="checkbox"]) {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border: 1px solid #d0d0d0;
    border-radius: 6px;
    font: inherit;
}

#leadCaptureForm input[type="checkbox"] {
    width: auto;
    margin-right: 6px;
}

#leadCaptureForm button {
    padding: 10px 14px;
    border: 0;
    border-radius: 6px;
    background: #8a642f;
    color: white;
    cursor: pointer;
}
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        Sai | Store Assistant
    </div>

    <div id="chatMessages" class="chat-messages">

        <div class="message ai-message">
            Hi, I’m Sai, your store assistant. I’m here to help you through your shopping journey. Ask me about products, orders, or store information.
        </div>

        <div id="leadCapturePrompt" class="message ai-message" hidden>
            <p>Before I continue, please share your name, email, and phone so the store can follow up about this conversation.</p>

            <form id="leadCaptureForm">
                <label>
                Name
                <input name="name" type="text" maxlength="120" autocomplete="name" required>
                </label>
                <br>

                <label>
                Email
                <input name="email" type="email" maxlength="254" autocomplete="email" required>
                </label>
                <br>

                <label>
                Phone
                <input name="phone" type="tel" maxlength="30" autocomplete="tel" required>
                </label>
                <br>

                <label>
                <input name="consentToContact" type="checkbox" required>
                I agree to receive a copy of this conversation by email and be contacted by the store about it.
                </label>
                <br>

                <button type="submit">Send details</button>
                <button id="skipLeadCapture" type="button">Not now</button>
                <p id="leadCaptureStatus" class="muted"></p>
            </form>
        </div>

    </div>



    <div class="chat-input">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask about our knives..."
        >

        <button id="sendButton" onclick="sendMessage()">Send</button>
        <button id="endChatButton" type="button">End chat</button>

    </div>

</div>


<script>
const widgetKey = "02f34ac7-23cb-4053-b924-518b56e8525e";
 let conversationHistory = [];

 let visitorId = localStorage.getItem("saiVisitorId");

 const leadSubmittedKey = `saiLeadSubmitted:${widgetKey}:${visitorId}`;
const questionCountKey = `saiQuestionCount:${widgetKey}:${visitorId}`;

let customerQuestionCount = Number(localStorage.getItem(questionCountKey)) || 0;
let leadSubmitted = localStorage.getItem(leadSubmittedKey) === "true";
let leadPromptShownThisPage = false;
let pendingMessage = null;
let chatEnded = false;
let inactivityWarningTimer = null;
let inactivityCloseTimer = null;
let inactivityWarningBubble = null;

if (!visitorId) {
    visitorId = crypto.randomUUID();
    localStorage.setItem("saiVisitorId", visitorId);
}

 document
    .getElementById("messageInput")
    .addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

    function formatPrice(value, currencyCode) {
    const amount = Number(value);
    const code = String(currencyCode || "").trim().toUpperCase();

    if (!Number.isFinite(amount)) {
        return "Price unavailable";
    }

    if (!/^[A-Z]{3}$/.test(code)) {
        return `${amount.toFixed(2)} (currency unavailable)`;
    }

    return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: code
    }).format(amount);
}

function maybeShowLeadCapture() {
  if (
    customerQuestionCount >= 3 &&
    !leadSubmitted &&
    !leadPromptShownThisPage
  ) {
    document.getElementById("leadCapturePrompt").hidden = false;
    leadPromptShownThisPage = true;
  }
}

document
  .getElementById("leadCaptureForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    const form = event.currentTarget;
    const formData = new FormData(form);
    const status = document.getElementById("leadCaptureStatus");
    const submitButton = form.querySelector('button[type="submit"]');

    status.textContent = "Saving…";
    submitButton.disabled = true;

    try {
      const response = await fetch("http://localhost:3000/leads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          widgetKey,
          visitorId,
          name: formData.get("name"),
          email: formData.get("email"),
          phone: formData.get("phone"),
          consentToContact: formData.get("consentToContact") === "on"
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.message || "Could not save your details.");
      }

      leadSubmitted = true;
      localStorage.setItem(leadSubmittedKey, "true");
      form.reset();
      status.textContent = data.message;
      const questionToResume = pendingMessage;
        pendingMessage = null;

        document.getElementById("leadCapturePrompt").hidden = true;
        document.getElementById("messageInput").disabled = false;
        document.querySelector(".chat-input button").disabled = false;

        const thankYouMessage = document.createElement("div");
        thankYouMessage.className = "message ai-message";
        thankYouMessage.textContent =
          "Thanks for sharing your details. Let me answer your question now.";
        const chatMessages = document.getElementById("chatMessages");
        chatMessages.appendChild(thankYouMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (questionToResume) {
        await sendMessage(questionToResume, true, true);
        }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      submitButton.disabled = false;
    }
  });

document
  .getElementById("skipLeadCapture")
  .addEventListener("click", async () => {
    const questionToResume = pendingMessage;
    pendingMessage = null;

    document.getElementById("leadCapturePrompt").hidden = true;
    document.getElementById("messageInput").disabled = false;
    document.querySelector(".chat-input button").disabled = false;

    if (questionToResume) {
      await sendMessage(questionToResume, true, true);
    }
  });
  function resetInactivityTimers() {
  clearTimeout(inactivityWarningTimer);
  clearTimeout(inactivityCloseTimer);

  if (inactivityWarningBubble) {
    inactivityWarningBubble.remove();
    inactivityWarningBubble = null;
  }

  if (chatEnded) return;

  inactivityWarningTimer = setTimeout(() => {
    if (chatEnded) return;

    inactivityWarningBubble = document.createElement("div");
    inactivityWarningBubble.className = "message ai-message";
    inactivityWarningBubble.textContent =
      "Just a heads-up: I’ll close this chat in 2 minutes if there are no new messages. Send a message to keep chatting.";

    const chatMessages = document.getElementById("chatMessages");
    chatMessages.appendChild(inactivityWarningBubble);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 8 * 60 * 1000);

  inactivityCloseTimer = setTimeout(() => {
    document.getElementById("endChatButton").click();
  }, 10 * 60 * 1000);
}
  document.getElementById("endChatButton").addEventListener("click", async () => {
  const endButton = document.getElementById("endChatButton");
  const input = document.getElementById("messageInput");
  const chatMessages = document.getElementById("chatMessages");

  endButton.disabled = true;

  try {
    const response = await fetch("http://localhost:3000/chat/end", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ widgetKey, visitorId })
    });

    const data = await response.json();
    if (!response.ok || !data.success) {
      throw new Error(data.message || "Could not end the chat.");
    }

    chatEnded = true;
    clearTimeout(inactivityWarningTimer);
    clearTimeout(inactivityCloseTimer);
    input.disabled = true;
    document.getElementById("sendButton").disabled = true;
    document.getElementById("leadCapturePrompt").hidden = true;

    const notice = document.createElement("div");
    notice.className = "message ai-message";
    notice.textContent = data.message;
    chatMessages.appendChild(notice);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  } catch (error) {
    endButton.disabled = false;

    const notice = document.createElement("div");
    notice.className = "message ai-message";
    notice.textContent = error.message || "Could not end the chat. Please try again.";
    chatMessages.appendChild(notice);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
});

async function sendMessage(messageOverride = null, bypassContactGate = false,messageAlreadyDisplayed = false) {
    const input = document.getElementById("messageInput");
    const message = String(messageOverride ?? input.value).trim();

    if (!message) return;
    if (chatEnded) return;
    resetInactivityTimers();
    if (!bypassContactGate) {
        customerQuestionCount += 1;
        localStorage.setItem(questionCountKey, String(customerQuestionCount));
    }

        if (
        !bypassContactGate &&
        customerQuestionCount >= 3 &&
        !leadSubmitted &&
        !leadPromptShownThisPage
    ) {
        pendingMessage = message;

        const chatMessages = document.getElementById("chatMessages");
        const userBubble = document.createElement("div");
        userBubble.className = "message user-message";
        userBubble.textContent = message;
        chatMessages.appendChild(userBubble);

        input.value = "";

        const prompt = document.getElementById("leadCapturePrompt");
        prompt.hidden = false;
        chatMessages.appendChild(prompt);
        leadPromptShownThisPage = true;

        chatMessages.scrollTop = chatMessages.scrollHeight;
        input.disabled = true;
        document.querySelector(".chat-input button").disabled = true;
        return;
    }

    conversationHistory.push({
        role: "user",
        content: message
    });

    try {
  await fetch("http://localhost:3000/chat/activity", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ widgetKey, visitorId })
  });
} catch (error) {
  console.error("Could not update chat activity:", error);
}

    const chatMessages = document.getElementById("chatMessages");
    if (!messageAlreadyDisplayed) {
    // Show user's message
    chatMessages.insertAdjacentHTML("beforeend", `
        <div class="message user-message">
            ${message}
        </div>
    `);
    }


    // Clear input
    input.value = "";

    try {

        const response = await fetch("http://localhost:3000/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                history: conversationHistory,
                visitorId: visitorId,
                widgetKey: widgetKey
            })

        });

        const data = await response.json();

        if (data.message) {

        chatMessages.insertAdjacentHTML("beforeend", `
            <div class="message ai-message">
            ${data.message}
            </div>
        `);

        }

        conversationHistory.push({
            role: "assistant",
            content: data.products.map(product => ({
                id: product.id,
                name: product.name,
                price: product.price,
                currency: product.currency,
                regular_price: product.regular_price,
                sale_price: product.sale_price,
                on_sale: product.on_sale,
                image: product.image,
                url: product.url,
                stock_status: product.stock_status,
                description: product.description
            }))
            });

        console.log(data);

        // Show AI response
        // Show products only when products were actually returned
            if (data.products && data.products.length > 0) {

                data.products.forEach(product => {

                    chatMessages.insertAdjacentHTML("beforeend", `
                        <div class="product-card">

                            ${
                                product.image
                                    ? `<img
                                        src="${product.image}"
                                        alt="${product.name}"
                                        class="product-image"
                                    >`
                                    : ""
                            }

                            <div class="product-content">

                                <h3>${product.name}</h3>

                                <p class="product-description">
                                    ${product.description}
                                </p>

                                <div class="product-price">
                                    ${
                                        product.on_sale
                                            ? `<span class="sale-price">${formatPrice(product.price, product.currency)}</span>
                                            <span class="regular-price"><s>${formatPrice(product.regular_price, product.currency)}</s></span>
                                            <span class="sale-badge">Sale</span>`
                                            : formatPrice(product.price, product.currency)
                                    }
                                </div>

                                <div class="product-stock ${
                                    product.stock_status === "instock"
                                        ? "in-stock"
                                        : "out-of-stock"
                                }">
                                    ${
                                        product.stock_status === "instock"
                                            ? "In Stock"
                                            : "Out of Stock"
                                    }
                                </div>

                                <a
                                    href="${product.url}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="product-button"
                                >
                                    View Product
                                </a>

                            </div>

                        </div>
                    `);

                });

            }
        //maybeShowLeadCapture();

        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;

    } catch (error) {

        console.error(error);

        chatMessages.insertAdjacentHTML("beforeend", `
            <div class="message ai-message">
                Sorry, something went wrong. Please try again.
            </div>
        `);

    }

    // console.log(
    //     "FIRST PRODUCT IMAGES:",
    //     data.products?.[0]?.image
    // );

}

</script>

</body>
</html>
